services:
  - type: web
    name: dr-gonzaga-website
    env: php
    buildCommand: ""
    startCommand: php -S 0.0.0.0:$PORT -t . index.php
    envVars:
      - key: PHP_VERSION
        value: 8.1
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "tls"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: "Dr. Gonzaga Website"
      - key: SMTP_TO
        sync: false
      - key: SMTP_CC
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

